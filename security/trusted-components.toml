[[claim_profiles]]
name = "rust_pure_workflow"
ceiling = "executable-only pure function typing/evaluation and same-executable record consistency; no M9 certificate, behavioral artifact, host effects, or Lean acceptance"
trusted_components = ["toolchain.rust", "rust.frontend", "rust.hir", "rust.workflow", "rust.cli"]

[[claim_profiles]]
name = "rust_local_job_lifecycle"
ceiling = "executable-only lifecycle/response checks and same-executable local journal recovery; no Lean theorem, authenticated OS authority, rollback-resistant store, or exactly-once external effects"
trusted_components = ["toolchain.rust", "rust.job_runtime", "rust.hir", "host.process_supervisor", "build.gates"]

[[claim_profiles]]
name = "pinned_init_job_receipt"
ceiling = "local pinned Lean accepted the generated Init target/candidate under the empty-axiom policy; captured replay is consistency only, not a fresh check, authenticated host event or independent proof audit"
trusted_components = ["toolchain.rust", "toolchain.lean", "rust.workflow", "rust.job_runtime", "rust.cli", "host.process_supervisor", "build.gates"]

[[claim_profiles]]
name = "bound_local_lean_proof"
ceiling = "NanoDA checked the exported proof closure under the selected axiom policy after fresh Lean source rebuilding and a trusted Lean target-binding check; no human approval, statement faithfulness, novelty, runtime attestation or general project integration claim"
trusted_components = ["toolchain.rust", "toolchain.lean", "lean.local_task_binding", "host.process_supervisor", "build.gates"]

[[components]]
id = "host.process_supervisor"
paths = ["crates/nmlt-runtime/Cargo.toml", "Cargo.lock", "crates/nmlt-runtime/src/process.rs", "crates/nmlt-runtime/src/process/file_output.rs", "rfcs/0028-contained-process-lifecycle.md", "rfcs/0033-bounded-lean-proof-exports.md"]
role = "Pinned ProcessKit 3.3.4 and the OS provide the recorded process/tree resource policy. A distinct file policy captures up to 16 MiB of exact stdout with byte-count/hash receipts and explicit sink-failure/EOF-flush checks; ordinary process limits remain unchanged. Windows Job Objects and Unix process-group/rlimit fallback have distinct limits. Filesystem/network access, system libraries and concurrent filesystem stability remain outside this containment contract."

[[claim_profiles]]
name = "bound_lean_declaration_context"
ceiling = "fresh Lean source/target reconstruction and bounded declaration/axiom metadata; assurance none, no proof acceptance or human approval"
