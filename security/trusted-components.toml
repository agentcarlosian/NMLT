manifest_version = "2.0.0-dynamic-product"
status = "pre-alpha"
reviewed = "2026-08-31"

outside_tcb = [
  "examples and explanatory prose",
  "the nmlt-eval reference explorer and its state counts",
  "proof search, fuzzers, mutation generators, and test counts",
]

residual_trust = [
  "host CPU, memory, kernel, filesystem, and process isolation",
  "Rust and Lean bootstrap and compiler toolchains",
  "SHA-256 and operating-system process execution",
  "GitHub-hosted runner images and dependency delivery",
  "no verified compiler theorem connects Rust elaboration to Lean semantics",
]

forbidden_claims = [
  "semantic verification from parsing or Rust type acceptance",
  "compiler correctness from a matching source digest",
  "unbounded proof from finite exploration",
  "step existence, reachability, fairness, or liveness from conditional lifting",
  "production authorization by any pre-alpha NMLT result",
]

[[components]]
name = "rust_language_pipeline"
paths = [
  "crates/nmlt-core",
  "crates/nmlt-hir",
  "crates/nmlt-ir",
  "crates/nmlt-elaborate",
  "crates/nmlt-compile",
  "crates/nmlt-kernel",
  "crates/nmlt-cli",
]
role = "lossless parsing, resolution, typed formation, and artifact production"
claim_ceiling = "implementation acceptance and reproducibility only"

[[components]]
name = "lean_behavior_semantics"
paths = [
  "mechanization/lean/NMLT/Behavior/ResourceBehavior.lean",
  "mechanization/lean/NMLT/Behavior/ResourceWorld.lean",
  "mechanization/lean/NMLT/Counterexamples/ResourceBehaviorControls.lean",
  "mechanization/lean/NMLT/Counterexamples/ResourceWorldControls.lean",
  "mechanization/lean/NMLT/Examples/ResourceWorldTransfer.lean",
]
role = "static behavior semantics plus separate affine authority-world product steps, conditional full step lifting, and controls"
claim_ceiling = "checked conditional declarations only; no step existence, reachability, or static/dynamic equivalence"

[[components]]
name = "artifact_decoder"
paths = [
  "mechanization/lean/NMLT/Artifact/BehaviorCore.lean",
  "mechanization/lean/NMLT/Artifact/SemanticClosure.lean",
  "mechanization/lean/NMLT/Artifact/CheckMain.lean",
]
role = "canonical decoding, source-byte identification, and artifact-derived static theorem construction"
claim_ceiling = "decoded semantics and checked theorem instance, not verified source translation"

[[components]]
name = "reference_explorer"
paths = ["crates/nmlt-eval"]
role = "bounded operational inspection"
claim_ceiling = "none"
