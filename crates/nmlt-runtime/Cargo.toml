[package]
name = "nmlt-runtime"
description = "Experimental bounded local job lifecycle and durable journal for NMLT"
version.workspace = true
edition.workspace = true
rust-version = "1.94"
license.workspace = true
publish = false

[dependencies]
nmlt-hir = { path = "../nmlt-hir" }
processkit = { version = "=3.3.4", features = ["limits"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true
