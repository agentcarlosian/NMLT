name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: nmlt
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: nmlt.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: nmlt

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.94.0
        run: rustup toolchain install 1.94.0 --profile minimal --target ${{ matrix.target }}

      - name: Build release nmlt binary
        run: cargo +1.94.0 build --release --locked -p nmlt-cli --bin nmlt --target ${{ matrix.target }}

      - name: Package Unix release archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          cp README.md LICENSE SECURITY.md dist/
          tar -czf "nmlt-${{ matrix.target }}.tar.gz" -C dist .

      - name: Package Windows release archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          Copy-Item README.md, LICENSE, SECURITY.md dist/
          Compress-Archive -Path dist\* -DestinationPath "nmlt-${{ matrix.target }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nmlt-${{ matrix.target }}
          path: nmlt-${{ matrix.target }}.${{ matrix.archive }}

  publish:
    name: Publish checksums and GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-artifacts
          sha256sum nmlt-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nmlt-checksums
          path: release-artifacts/SHA256SUMS.txt

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-artifacts/* \
            --title "NMLT ${GITHUB_REF_NAME}" \
            --generate-notes
