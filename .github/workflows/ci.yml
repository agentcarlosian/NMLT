name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Replay tests repeatedly copy and hash the exact executable. Linux embeds
# debug information in that file; omitting symbols keeps these integration
# tests within the CI budget without changing assertions.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Run repository gate
        run: make ci

  lean:
    name: Lean metatheory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # These integration checks repeatedly hash the complete Lean installation.
    # Optimize that host work while preserving development debug assertions;
    # the Rust workspace job above also checks the default optimization level.
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain for independent NanoDA checker
        run: rustup toolchain install 1.94.0 --profile minimal

      # Keep dependency state outside the source checkout. This also makes the
      # Lean gate independent of any developer-local .lake directory.
      - name: Stage Lean package outside Rust workspace
        id: stage_lean
        run: |
          lean_package_dir="$(mktemp -d "${RUNNER_TEMP}/nmlt-lean.XXXXXX")"
          cp -a mechanization/lean/. "${lean_package_dir}/"
          printf 'leanprover/lean4:%s\n' "$(cat mechanization/lean/lean-toolchain)" > "${lean_package_dir}/lean-toolchain"
          echo "path=${lean_package_dir}" >> "${GITHUB_OUTPUT}"

      - name: Build Lean artifacts
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: ${{ steps.stage_lean.outputs.path }}
          build: true
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: true

      - name: Independently check Lean declarations with pinned nanoda
        env:
          NANODA_ALLOW_SORRY: "false"
        run: ./tools/check_nanoda.sh "${{ steps.stage_lean.outputs.path }}" NMLT

      - name: Check theorem axioms and source-bound artifact decoding
        run: ./tools/check_metatheory.sh "${{ steps.stage_lean.outputs.path }}"

      - name: Run the frozen R0 reference workflows
        run: make r0-baselines

      - name: Check the pinned Lean adapter and asynchronous job controls
        run: make r2-lean r2-source-lean r2-project-lean r2-lean-terms

      - name: Compare finite Rust exploration with Lean
        run: bash tools/check_finite_parity.sh "${{ steps.stage_lean.outputs.path }}"

      - name: Check decoded v2 execution and resource graph parity
        run: bash tools/check_execution.sh "${{ steps.stage_lean.outputs.path }}"

      - name: Check source safety invariants and counterexamples
        run: python3 tools/check_invariants.py --checker "${{ steps.stage_lean.outputs.path }}/.lake/build/bin/nmlt-invariant-check"

  lean-projects:
    name: Bound Lean project proofs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain for CLI and independent checker
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Stage pinned Lean package
        id: stage_lean
        run: |
          lean_package_dir="$(mktemp -d "${RUNNER_TEMP}/nmlt-project-lean.XXXXXX")"
          cp -a mechanization/lean/. "${lean_package_dir}/"
          printf 'leanprover/lean4:%s\n' "$(cat mechanization/lean/lean-toolchain)" > "${lean_package_dir}/lean-toolchain"
          echo "path=${lean_package_dir}" >> "${GITHUB_OUTPUT}"

      - name: Install and build with the pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: ${{ steps.stage_lean.outputs.path }}
          build: true
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: true

      - name: Bind local Lean tasks and independently recheck final proof artifacts
        run: make r3-lean-projects
