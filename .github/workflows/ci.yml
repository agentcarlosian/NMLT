name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Run repository gate
        run: make ci

  lean:
    name: Lean metatheory
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain for independent NanoDA checker
        run: rustup toolchain install 1.94.0 --profile minimal

      # Keep dependency state outside the source checkout. This also makes the
      # Lean gate independent of any developer-local .lake directory.
      - name: Stage Lean package outside Rust workspace
        id: stage_lean
        run: |
          lean_package_dir="$(mktemp -d "${RUNNER_TEMP}/nmlt-lean.XXXXXX")"
          cp -a mechanization/lean/. "${lean_package_dir}/"
          printf 'leanprover/lean4:%s\n' "$(cat mechanization/lean/lean-toolchain)" > "${lean_package_dir}/lean-toolchain"
          echo "path=${lean_package_dir}" >> "${GITHUB_OUTPUT}"

      - name: Build Lean artifacts
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: ${{ steps.stage_lean.outputs.path }}
          build: true
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: true

      - name: Independently check Lean declarations with pinned nanoda
        env:
          NANODA_ALLOW_SORRY: "false"
        run: ./tools/check_nanoda.sh "${{ steps.stage_lean.outputs.path }}" NMLT

      - name: Check theorem axioms and matching-source artifact decoding
        run: ./tools/check_metatheory.sh "${{ steps.stage_lean.outputs.path }}"
