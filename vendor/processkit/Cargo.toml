[package]
edition = "2024"
rust-version = "1.88"
name = "processkit"
version = "3.3.4-nmlt.1"
build = false
exclude = [
    ".github/",
    ".editorconfig",
    ".gitattributes",
    "AGENTS.md",
    "CLAUDE.md",
    "cliff.toml",
    "deny.toml",
    "rust-toolchain.toml",
    "fuzz/",
    "loom/",
    "cover.png",
    "book.toml",
    "theme/",
    "docs/SUMMARY.md",
    "docs/.nojekyll",
    "docs/processkit-cover.png",
    "docs/processkit-cover-social.jpg",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async child-process management for tokio: whole-tree kill-on-drop (no orphans), plus streaming, pipelines, timeouts, and supervision"
homepage = "https://github.com/ZelAnton/ProcessKit-rs"
documentation = "https://docs.rs/processkit"
readme = "README.md"
keywords = [
    "process",
    "subprocess",
    "tokio",
    "async",
    "process-group",
]
categories = [
    "asynchronous",
    "os",
    "os::unix-apis",
    "os::windows-apis",
    "concurrency",
]
license = "MIT"
repository = "https://github.com/ZelAnton/ProcessKit-rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = ["process-control"]
json = [
    "dep:serde",
    "dep:serde_json",
]
limits = ["stats"]
metrics = ["dep:metrics"]
mock = ["dep:mockall"]
process-control = []
pty = ["windows-sys/Win32_System_Pipes"]
record = [
    "dep:serde",
    "dep:serde_json",
]
report-serde = ["dep:serde"]
stats = ["windows-sys/Win32_System_ProcessStatus"]
tracing = ["dep:tracing"]

[lib]
name = "processkit"
path = "src/lib.rs"





















[dependencies.async-trait]
version = "0.1.9"

[dependencies.encoding_rs]
version = "0.8"

[dependencies.metrics]
version = "0.24.6"
optional = true

[dependencies.mockall]
version = "0.15"
optional = true

[dependencies.mutants]
version = "0.0.4"

[dependencies.serde]
version = "1.0.166"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0.100"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1.39"
features = [
    "process",
    "time",
    "io-util",
    "rt",
    "macros",
    "sync",
    "fs",
    "net",
]

[dependencies.tokio-stream]
version = "0.1.3"
features = [
    "io-util",
    "sync",
]

[dependencies.tokio-util]
version = "0.7"
default-features = false

[dependencies.tracing]
version = "0.1.6"
optional = true

[dev-dependencies.criterion]
version = "0.8"
features = ["async_tokio"]

[dev-dependencies.proptest]
version = "1"

[dev-dependencies.serde_json]
version = "1.0.100"

[dev-dependencies.tempfile]
version = "3"

